<!DOCTYPE html>
<html>

<head>
    <!-- Se a função de co-navegação for necessária -->
    <script type="text/javascript" src="https://aicc.unifique.com.br/service-cloud/resource.root/cobrowse/sdk/cobrowse.js"></script>
    <script type="text/javascript" src="https://aicc.unifique.com.br/service-cloud/webclient/chat_client/js/cobrowseCommon.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js?v=1.2"></script>
</head>

<body>
    <!-- Container pré-alocado para evitar que o script falhe ao procurar elementos no DOM -->
	<!-- Container estrutural exigido pelo cliente de chat da Huawei/AICC -->
    <div id="newThirdPartyClientDiv" style="position: fixed; bottom: 0; right: 0; z-index: 999999;"></div>
    <div id="chat-widget-container"></div>

    <script>
        const userId = "202608141457"; 
        const userName = "AXW1479999";
        const tenantSpaceId = "202609047493";
        const configId = "202609047493084770";
        const locale = "en"; 
        const $ContextPath = "https://aicc.unifique.com.br/service-cloud";
		
        let serviceUrl = $ContextPath + "/webclient/chat_client/js/newThirdPartyClient.js?&t=" + new Date().getTime();
        let thirdUserData = {};
        thirdUserData['thirdUserName'] = userName;				
        thirdUserData['thirdUserId'] = userId;					
        thirdUserData['tenantSpaceId'] = tenantSpaceId;			
        thirdUserData['channelConfigId'] = configId;	
        thirdUserData['locale'] = locale;                                       
        thirdUserData['timestamp'] = "2026-09-22T17:22:45.478Z";
        thirdUserData['thirdPartAuthorization'] = "auth-v2/202609047493084770/2026-09-22T17:22:45.478Z/content-length;content-type/d1ad657fd483c45fae1386a19a99e726ffacbeeeca2a5dc4ea16e2b8994bc19a";
		
        console.log("URL:", serviceUrl);
        console.log("thirdUserData:", JSON.stringify(thirdUserData));

        // Executa a requisição AJAX apenas após o DOM estar completamente carregado
        $(document).ready(function () {
            $.ajax({
                url: serviceUrl,
                method: "POST",
                data: JSON.stringify(thirdUserData),
                xhrFields: { withCredentials: true },
                success: function (data) {
                    importScript(data);
                },
                error: function (XMLHttpRequest, textStatus) {
                    alert("unauthorized, validate failed");
                }
            });
        });

        // Função segura para injetar e executar o script retornado
 /*       var importScript = (function (oHead) {
            function loadError(oError) {
                throw new URIError("The script " + oError.target.src + " is not accessible.");
            }
            return function (sSrc, fOnload) {
                var oScript = document.createElement("script");
                oScript.type = "text/javascript";
                oScript.onerror = loadError;
                if (fOnload) { oScript.onload = fOnload; }
                
                // Adiciona o script de forma segura ao final do corpo ou no head
                oHead.appendChild(oScript);
                oScript.innerHTML = sSrc;
            };
        })(document.head || document.getElementsByTagName("body")[0]);
*/
		var importScript = function (sSrc) {
			var blob = new Blob([sSrc], { type: 'text/javascript;charset=utf-8' });
			var url = URL.createObjectURL(blob);
			var oScript = document.createElement("script");
			oScript.type = "text/javascript";
			oScript.src = url;
			oScript.onload = function() {
				URL.revokeObjectURL(url);
			};
			oScript.onerror = function(oError) {
				throw new URIError("Erro ao carregar o script do chat.");
			};
			document.body.appendChild(oScript);
		};
    </script>
</body>

</html>
